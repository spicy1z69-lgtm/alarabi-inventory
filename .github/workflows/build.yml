name: Build check

on:
  pull_request:
    branches: [main, feature/quick-search-archive]
  push:
    branches: [main, audit/safe-fixes-2026-10]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
